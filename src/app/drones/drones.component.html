<div class="drones-container">
  <!-- Encabezado con título y botón para ir al formulario -->
  <div class="header-section">
    <h1>Catálogo de Drones</h1>
    <button class="btn-create" (click)="toggleForm()">
      {{ showForm ? 'Ocultar Formulario' : 'Crear Nuevo Dron' }}
    </button>
  </div>

  <!-- Sección de categorías -->
  <div class="categories-container">
    <h2>Categorías</h2>
    <div class="categories-list">
      <div class="category-item" (click)="filterByCategory('venta')">
        <img src="images/venda.jpg" alt="Venta" />
        <span>Venta</span>
      </div>
      <div class="category-item" (click)="filterByCategory('alquiler')">
        <img src="images/alquiler.jpg" alt="Alquiler" />
        <span>Alquiler</span>
      </div>
      <div class="category-item" (click)="filterByCategory('accesorios')">
        <img src="images/accesoris.webp" alt="Accesorios" />
        <span>Accesorios</span>
      </div>
      <div class="category-item" (click)="filterByCategory('peces')">
        <img src="images/peces.webp" alt="Peces" />
        <span>Peces</span>
      </div>
    </div>
  </div>

  <!-- Listado de drones en tarjetas (grid) -->
  <div class="drone-cards">
    <div class="drone-card" *ngFor="let drone of filteredDrones">
      <div class="card-content">
        <h3>{{ drone.name }}</h3>
        <p class="price">{{ drone.price | currency:'USD':'symbol':'1.0-0' }}</p>
        <p class="type">Tipo: {{ drone.type }}</p>
        <p class="condition">Condición: {{ drone.condition }}</p>
        <p class="description">{{ drone.description }}</p>

        <!-- Mostrar si el dron está vendido -->
        <p *ngIf="drone.status === 'vendido'" class="text-danger">
          <strong>VENDIDO</strong>
        </p>
      </div>
      <div class="card-actions">
        <!-- Si el dron es del usuario actual -->
        <button *ngIf="isOwner(drone)" (click)="onEdit(drone)">Editar</button>
        <button *ngIf="isOwner(drone)" (click)="onDelete(drone)">Eliminar</button>

        <!-- Si el dron NO es del usuario actual y está disponible -->
        <button
          *ngIf="!isOwner(drone) && drone.status !== 'vendido'"
          (click)="onBuy(drone)"
        >
          Comprar
        </button>
        <button
          *ngIf="!isOwner(drone)"
          (click)="onAddReview(drone)"
        >
          Agregar Reseña
        </button>
      </div>
    </div>
  </div>

  <!-- Formulario para crear/editar dron (se muestra u oculta con showForm) -->
  <div class="drone-form-container" *ngIf="showForm">
    <h2>{{ editing ? 'Editar Dron' : 'Crear Nuevo Dron' }}</h2>
    <form [formGroup]="droneForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="id">ID:</label>
        <input id="id" formControlName="id" type="text" />
      </div>
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input id="name" formControlName="name" type="text" />
      </div>
      <div class="form-group">
        <label for="model">Modelo:</label>
        <input id="model" formControlName="model" type="text" />
      </div>
      <div class="form-group">
        <label for="price">Precio:</label>
        <input id="price" formControlName="price" type="number" />
      </div>
      <div class="form-group">
        <label for="description">Descripción:</label>
        <textarea id="description" formControlName="description"></textarea>
      </div>
      <div class="form-group">
        <label for="images">Imágenes (separadas por comas):</label>
        <input id="images" formControlName="images" type="text" />
      </div>
      <div class="form-group">
        <label for="type">Tipo:</label>
        <select id="type" formControlName="type">
          <option value="venta">Venta</option>
          <option value="alquiler">Alquiler</option>
        </select>
      </div>
      <div class="form-group">
        <label for="condition">Condición:</label>
        <select id="condition" formControlName="condition">
          <option value="nuevo">Nuevo</option>
          <option value="usado">Usado</option>
        </select>
      </div>
      <div class="form-group">
        <label for="location">Ubicación:</label>
        <input id="location" formControlName="location" type="text" />
      </div>
      <div class="form-group">
        <label for="contact">Contacto:</label>
        <input id="contact" formControlName="contact" type="text" />
      </div>
      <div class="form-group">
        <label for="category">Categoría:</label>
        <input id="category" formControlName="category" type="text" />
      </div>
      <div class="form-group">
        <label for="sellerId">ID del Vendedor:</label>
        <input id="sellerId" formControlName="sellerId" type="text" />
      </div>
      <div class="form-actions">
        <button type="submit">
          {{ editing ? 'Actualizar Dron' : 'Crear Dron' }}
        </button>
        <button type="button" (click)="resetForm()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
